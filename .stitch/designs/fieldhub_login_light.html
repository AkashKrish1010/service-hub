<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FieldHub — Mobile Login</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {},
          borderRadius: {
            DEFAULT: "0.5rem",
            lg: "1rem",
            xl: "1.5rem",
            full: "9999px"
          },
          fontFamily: {
            headline: ["Plus Jakarta Sans"],
            display: ["Plus Jakarta Sans"],
            body: ["Plus Jakarta Sans"],
            label: ["Plus Jakarta Sans"]
          }
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-slate-50 text-slate-900 font-body antialiased min-h-screen flex flex-col justify-between selection:bg-blue-100 selection:text-blue-900">
<!-- Top App Bar (Shared Component Anchor) -->
<header class="bg-transparent docked full-width top-0 flat no shadows">
<div class="flex justify-between items-center w-full px-4 pt-3 pb-2 max-w-md mx-auto">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full text-slate-900 hover:bg-slate-100 transition-colors active:scale-95 transition-transform duration-150" type="button">
<span class="material-symbols-outlined text-xl">arrow_back</span>
</button>
<span class="font-display font-bold text-xl tracking-tight text-slate-900">FieldHub</span>
<button aria-label="Support &amp; Help" class="p-2 -mr-2 rounded-full text-slate-900 hover:bg-slate-100 transition-colors active:scale-95 transition-transform duration-150" type="button">
<span class="material-symbols-outlined text-xl">help_outline</span>
</button>
</div>
</header>
<!-- Mobile Form Viewport Container (portrait ~390px) -->
<main class="w-full max-w-md mx-auto px-6 pt-2 pb-6 flex-1 flex flex-col justify-center">
<!-- Brand Symbol & Hierarchy -->
<div class="mb-7">
<div class="w-12 h-12 rounded-2xl bg-blue-600/10 flex items-center justify-center mb-5 ring-1 ring-blue-600/20 shadow-xs">
<svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="3"></circle>
<path d="M19.07 4.93a10 10 0 0 0-14.14 0"></path>
<path d="M4.93 19.07a10 10 0 0 0 14.14 0"></path>
</svg>
</div>
<h1 class="text-3xl font-bold tracking-tight text-slate-900 font-headline">Welcome back</h1>
<p class="text-sm text-slate-500 mt-1.5 font-normal">Sign in to access your routes and field tasks</p>
</div>
<!-- Role Segment Selector -->
<div class="bg-slate-100 p-1.5 rounded-2xl flex border border-slate-200/80 mb-6 w-full shadow-inner" id="roleToggle">
<button class="bg-white text-slate-900 font-semibold text-sm py-2.5 px-4 rounded-xl flex-1 flex items-center justify-center gap-2 shadow-sm transition-all duration-200" id="btnOfficer" onclick="switchRole('officer')" type="button">
<svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
</svg>
<span>Field Officer</span>
</button>
<button class="text-slate-500 font-medium text-sm py-2.5 px-4 rounded-xl flex-1 flex items-center justify-center gap-2 hover:text-slate-800 transition-all duration-200" id="btnDriver" onclick="switchRole('driver')" type="button">
<svg class="w-4 h-4 text-slate-400 group-hover:text-slate-600" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9"></circle>
<circle cx="12" cy="12" r="2"></circle>
<path d="M12 14v7"></path>
<path d="m4.93 7.93 5.36 3.14"></path>
<path d="m19.07 7.93-5.36 3.14"></path>
</svg>
<span>Driver</span>
</button>
</div>
<!-- Input Form -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Input 1 -->
<div>
<label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5 font-label" id="identityLabel">
          Officer ID or Phone Number
        </label>
<div class="h-14 bg-white border border-slate-200 rounded-xl px-4 flex items-center gap-3 focus-within:border-blue-600 focus-within:ring-2 focus-within:ring-blue-100 transition shadow-xs">
<svg class="w-5 h-5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
<circle cx="12" cy="7" r="4"></circle>
</svg>
<input class="w-full bg-transparent border-none p-0 text-slate-900 placeholder:text-slate-400 text-sm focus:ring-0 font-body" id="identityInput" placeholder="e.g. OF-4829 or +1 (555) 000-0000" type="text"/>
</div>
</div>
<!-- Input 2 -->
<div>
<label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5 font-label">
          Password
        </label>
<div class="h-14 bg-white border border-slate-200 rounded-xl px-4 flex items-center gap-3 focus-within:border-blue-600 focus-within:ring-2 focus-within:ring-blue-100 transition shadow-xs">
<svg class="w-5 h-5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
<rect height="11" rx="2" ry="2" width="18" x="3" y="11"></rect>
<path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
</svg>
<input class="w-full bg-transparent border-none p-0 text-slate-900 placeholder:text-slate-400 text-sm focus:ring-0 font-body" id="passwordInput" placeholder="Enter password" type="password" value="••••••••••••"/>
<button aria-label="Toggle password visibility" class="p-1 text-slate-400 hover:text-slate-600 focus:outline-none transition" onclick="togglePassword()" type="button">
<svg class="w-5 h-5" fill="none" id="eyeIcon" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
<circle cx="12" cy="12" r="3"></circle>
</svg>
</button>
</div>
</div>
<!-- Micro Action Row -->
<div class="pt-1 flex items-center justify-between text-xs">
<label class="flex items-center gap-2.5 cursor-pointer group">
<input checked="" class="w-4 h-4 rounded text-blue-600 border-slate-300 focus:ring-blue-500 transition cursor-pointer" type="checkbox"/>
<span class="text-slate-600 font-medium group-hover:text-slate-800 transition">Remember for 30 days</span>
</label>
<a class="text-blue-600 font-semibold hover:underline" href="#forgot">Forgot password?</a>
</div>
<!-- Primary Action CTA -->
<button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold text-base h-14 rounded-2xl shadow-lg shadow-blue-500/20 active:scale-[0.98] transition flex items-center justify-center gap-2 mt-6" id="submitBtn" type="submit">
<span>Sign In as Officer</span>
<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<path d="M5 12h14"></path>
<path d="m12 5 7 7-7 7"></path>
</svg>
</button>
</form>
<!-- Biometric Alternative Section -->
<div class="mt-8 mb-6">
<div class="relative flex items-center justify-center mb-6">
<div class="border-t border-slate-200 w-full absolute"></div>
<span class="bg-slate-50 px-3 relative text-xs text-slate-400 font-medium uppercase tracking-wider">or continue with</span>
</div>
<div class="flex flex-col items-center">
<button aria-label="Log in with Face or Fingerprint Biometrics" class="w-14 h-14 bg-white border border-slate-200 hover:border-blue-400 hover:shadow-md rounded-2xl flex items-center justify-center text-slate-700 hover:text-blue-600 transition duration-150 active:scale-95 shadow-xs group" type="button">
<svg class="w-7 h-7 text-slate-600 group-hover:text-blue-600 transition" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"></path>
<path d="M14 13.12c0 2.38 0 6.38-1 8.88"></path>
<path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"></path>
<path d="M2 12a10 10 0 0 1 18-6"></path>
<path d="M2 16h.01"></path>
<path d="M21.8 16c.2-2 .131-5.354 0-6"></path>
<path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"></path>
<path d="M8.65 22c.21-.66.45-1.32.57-2"></path>
<path d="M9 6.8a6 6 0 0 1 9 5.2v2"></path>
</svg>
</button>
<span class="text-xs text-slate-500 font-medium mt-2">Quick biometric login</span>
</div>
</div>
<!-- Sign Up & Secondary Actions -->
<div class="text-center pt-2">
<p class="text-xs text-slate-500 font-medium">
        Don't have an account? 
        <a class="text-blue-600 font-bold hover:underline ml-1" href="#signup">Sign up</a>
</p>
</div>
</main>
<!-- Footer (Shared Component Anchor) -->
<footer class="w-full py-4 text-center max-w-md mx-auto px-6 bg-transparent docked full-width bottom-0 flat no shadows">
<div class="flex justify-center items-center gap-4 text-xs font-body text-slate-500 mb-2">
<a class="hover:text-slate-800 transition-colors active:opacity-80" href="#privacy">Privacy Policy</a>
<span class="text-slate-300">•</span>
<a class="hover:text-slate-800 transition-colors active:opacity-80" href="#terms">Terms of Service</a>
<span class="text-slate-300">•</span>
<a class="hover:text-slate-800 transition-colors active:opacity-80" href="#help">Help Support</a>
</div>
<p class="font-display font-semibold text-xs text-slate-400">FieldHub © 2024. All rights reserved.</p>
</footer>
<!-- Script for interactive toggle micro-interactions -->
<script>
    function switchRole(role) {
      const btnOfficer = document.getElementById('btnOfficer');
      const btnDriver = document.getElementById('btnDriver');
      const submitBtn = document.getElementById('submitBtn');
      const identityLabel = document.getElementById('identityLabel');
      const identityInput = document.getElementById('identityInput');

      if (role === 'officer') {
        btnOfficer.className = "bg-white text-slate-900 font-semibold text-sm py-2.5 px-4 rounded-xl flex-1 flex items-center justify-center gap-2 shadow-sm transition-all duration-200";
        btnDriver.className = "text-slate-500 font-medium text-sm py-2.5 px-4 rounded-xl flex-1 flex items-center justify-center gap-2 hover:text-slate-800 transition-all duration-200";
        submitBtn.querySelector('span').innerText = "Sign In as Officer";
        identityLabel.innerText = "Officer ID or Phone Number";
        identityInput.placeholder = "e.g. OF-4829 or +1 (555) 000-0000";
      } else {
        btnDriver.className = "bg-white text-slate-900 font-semibold text-sm py-2.5 px-4 rounded-xl flex-1 flex items-center justify-center gap-2 shadow-sm transition-all duration-200";
        btnOfficer.className = "text-slate-500 font-medium text-sm py-2.5 px-4 rounded-xl flex-1 flex items-center justify-center gap-2 hover:text-slate-800 transition-all duration-200";
        submitBtn.querySelector('span').innerText = "Sign In as Driver";
        identityLabel.innerText = "Driver ID or Commercial License";
        identityInput.placeholder = "e.g. DR-9921 or DL-40291";
      }
    }

    function togglePassword() {
      const pwd = document.getElementById('passwordInput');
      const eyeIcon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        eyeIcon.innerHTML = `
          <path d="m15 18-.722-3.25"/>
          <path d="M2 8a10.645 10.645 0 0 0 20 0"/>
          <path d="m20 15-1.726-2.05"/>
          <path d="m4 15 1.726-2.05"/>
          <path d="m9 18 .722-3.25"/>
        `;
      } else {
        pwd.type = 'password';
        eyeIcon.innerHTML = `
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
          <circle cx="12" cy="12" r="3"/>
        `;
      }
    }
  </script>
</body></html>
