<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FieldHub - Create Account</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {},
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
          spacing: {},
          fontFamily: {
            headline: ["Plus Jakarta Sans", "sans-serif"],
            display: ["Plus Jakarta Sans", "sans-serif"],
            body: ["Plus Jakarta Sans", "sans-serif"],
            label: ["Plus Jakarta Sans", "sans-serif"]
          },
          fontSize: {}
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-slate-50 text-slate-900 font-body antialiased min-h-screen flex flex-col justify-between selection:bg-blue-100 selection:text-blue-700">
<!-- Top App Bar (Shared Component Anchor) -->
<header class="w-full bg-transparent flex justify-between items-center px-4 pt-4 pb-2 max-w-md mx-auto">
<button aria-label="Go Back" class="w-10 h-10 rounded-full border border-slate-200 flex items-center justify-center text-slate-700 bg-white hover:bg-slate-100 transition-colors active:scale-95 duration-150 shadow-sm" type="button">
<span class="material-symbols-outlined text-xl">arrow_back</span>
</button>
<div class="flex items-center gap-1.5 px-3 py-1 bg-white border border-slate-200 rounded-full shadow-sm">
<span class="w-2 h-2 rounded-full bg-blue-600 animate-pulse"></span>
<span class="font-display font-bold text-xs tracking-tight text-slate-800">FieldHub</span>
<span class="text-xs font-semibold text-slate-400 border-l border-slate-200 pl-1.5 ml-0.5">Step 1 of 2</span>
</div>
<button aria-label="Help" class="w-10 h-10 rounded-full border border-slate-200 flex items-center justify-center text-slate-600 bg-white hover:bg-slate-100 transition-colors active:scale-95 duration-150 shadow-sm" type="button">
<span class="material-symbols-outlined text-xl">help_outline</span>
</button>
</header>
<!-- Main Container -->
<main class="w-full max-w-md mx-auto px-5 py-3 flex-1 flex flex-col justify-start">
<!-- Title & Greeting Header -->
<section class="mt-2 mb-6">
<h1 class="font-headline font-bold text-2xl tracking-tight text-slate-900">Create Account</h1>
<p class="text-sm font-normal text-slate-500 mt-1 leading-relaxed">Select your operational role to get started</p>
</section>
<!-- Role Selection -->
<section class="mb-6">
<div class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 px-0.5">
        I am registering as:
      </div>
<div class="space-y-3">
<!-- Card A (Field Report Officer - Selected) -->
<label class="relative border-2 border-blue-600 bg-blue-50/60 rounded-2xl p-4 flex items-center justify-between shadow-sm cursor-pointer transition-all duration-200" id="role-fro-card">
<input checked="" class="sr-only" name="role" onchange="toggleRole('fro')" type="radio" value="fro"/>
<div class="flex items-center gap-3.5">
<div class="w-11 h-11 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center shrink-0" id="role-fro-icon-box">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<p class="font-semibold text-slate-900 text-sm leading-snug">Field Report Officer</p>
<p class="text-xs text-slate-500 mt-0.5 leading-tight">Submit reports, site checks &amp; audit logs</p>
</div>
</div>
<div class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center shrink-0 shadow-sm text-white" id="role-fro-indicator">
<svg class="w-3.5 h-3.5 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</label>
<!-- Card B (Driver - Unselected) -->
<label class="relative border border-slate-200 bg-white rounded-2xl p-4 flex items-center justify-between cursor-pointer hover:border-slate-300 transition-all duration-200 shadow-sm" id="role-driver-card">
<input class="sr-only" name="role" onchange="toggleRole('driver')" type="radio" value="driver"/>
<div class="flex items-center gap-3.5">
<div class="w-11 h-11 rounded-xl bg-slate-100 text-slate-400 flex items-center justify-center shrink-0 transition-colors" id="role-driver-icon-box">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M8 17a2 2 0 100-4 2 2 0 000 4zm8 0a2 2 0 100-4 2 2 0 000 4zM3 9l2-4h10l2 4M3 9v8a1 1 0 001 1h1m12 0h2a1 1 0 001-1V9M3 9h18m-4 0v4H7V9" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<p class="font-semibold text-slate-800 text-sm leading-snug">Driver</p>
<p class="text-xs text-slate-500 mt-0.5 leading-tight">Manage routes, pickups &amp; deliveries</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-slate-300 bg-white flex items-center justify-center shrink-0 transition-colors" id="role-driver-indicator">
<span class="w-2 h-2 rounded-full bg-transparent"></span>
</div>
</label>
</div>
</section>
<!-- Registration Form -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div>
<label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5 px-0.5" for="full-name">Full Name</label>
<div class="relative flex items-center rounded-xl border border-slate-200 bg-white shadow-sm focus-within:border-blue-600 focus-within:ring-2 focus-within:ring-blue-100 transition-all">
<div class="pl-4 text-slate-400 pointer-events-none flex items-center justify-center">
<svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full py-3.5 pl-3 pr-4 text-slate-900 placeholder:text-slate-400 bg-transparent text-sm border-0 focus:ring-0 focus:outline-none" id="full-name" placeholder="e.g. Alex Morgan" required="" type="text"/>
</div>
</div>
<!-- Mobile Number -->
<div>
<label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5 px-0.5" for="mobile-number">Mobile Number</label>
<div class="relative flex items-center rounded-xl border border-slate-200 bg-white shadow-sm focus-within:border-blue-600 focus-within:ring-2 focus-within:ring-blue-100 transition-all">
<div class="pl-4 text-slate-400 pointer-events-none flex items-center justify-center">
<svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full py-3.5 pl-3 pr-4 text-slate-900 placeholder:text-slate-400 bg-transparent text-sm border-0 focus:ring-0 focus:outline-none" id="mobile-number" placeholder="+1 (555) 234-5678" required="" type="tel"/>
</div>
</div>
<!-- Officer Badge ID / Credential Dynamic Field -->
<div>
<label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5 px-0.5" for="badge-id" id="badge-label">Officer Badge ID</label>
<div class="relative flex items-center rounded-xl border border-slate-200 bg-white shadow-sm focus-within:border-blue-600 focus-within:ring-2 focus-within:ring-blue-100 transition-all">
<div class="pl-4 text-slate-400 pointer-events-none flex items-center justify-center">
<svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full py-3.5 pl-3 pr-4 text-slate-900 placeholder:text-slate-400 bg-transparent text-sm border-0 focus:ring-0 focus:outline-none" id="badge-id" placeholder="e.g. FRO-9021" required="" type="text"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5 px-0.5" for="password">Password</label>
<div class="relative flex items-center rounded-xl border border-slate-200 bg-white shadow-sm focus-within:border-blue-600 focus-within:ring-2 focus-within:ring-blue-100 transition-all">
<div class="pl-4 text-slate-400 pointer-events-none flex items-center justify-center">
<svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full py-3.5 pl-3 pr-11 text-slate-900 placeholder:text-slate-400 bg-transparent text-sm border-0 focus:ring-0 focus:outline-none" id="password" placeholder="Minimum 8 characters" required="" type="password"/>
<button aria-label="Toggle password view" class="absolute right-3 p-1.5 text-slate-400 hover:text-slate-600 focus:outline-none rounded-lg" onclick="togglePasswordVisibility()" type="button">
<svg class="w-5 h-5 stroke-[1.8]" fill="none" id="eye-icon" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Agreement Checkbox -->
<div class="pt-2 flex items-start gap-2.5">
<input checked="" class="mt-0.5 w-4 h-4 rounded text-blue-600 border-slate-300 focus:ring-blue-500 cursor-pointer" id="terms" required="" type="checkbox"/>
<label class="text-xs text-slate-600 leading-relaxed cursor-pointer select-none" for="terms">
          I agree to the <a class="text-blue-600 font-medium hover:underline" href="#">Terms of Service</a> &amp; <a class="text-blue-600 font-medium hover:underline" href="#">Privacy Policy</a>
</label>
</div>
<!-- Primary CTA Button -->
<div class="pt-2">
<button class="w-full h-14 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-base shadow-lg shadow-blue-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="submit-btn" type="submit">
<span id="submit-text">Create Officer Account</span>
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</form>
<!-- Sign In Alternative Link -->
<div class="mt-6 text-center text-sm text-slate-600">
      Already have an account? 
      <a class="font-semibold text-blue-600 hover:text-blue-700 hover:underline transition-colors ml-1" href="#">Sign in</a>
</div>
</main>
<!-- Footer (Shared Component Anchor) -->
<footer class="w-full py-4 text-center max-w-md mx-auto px-6 bg-transparent">
<div class="flex items-center justify-center space-x-3 text-xs text-slate-500 mb-2">
<a class="hover:text-slate-800 transition-colors" href="#">Privacy Policy</a>
<span class="text-slate-300">•</span>
<a class="hover:text-slate-800 transition-colors" href="#">Terms of Service</a>
<span class="text-slate-300">•</span>
<a class="hover:text-slate-800 transition-colors" href="#">Help Support</a>
</div>
<p class="font-body text-xs text-slate-400">FieldHub © 2024. All rights reserved.</p>
</footer>
<!-- Interactive Logic for Role Selector and Password Toggle -->
<script>
    function toggleRole(role) {
      const froCard = document.getElementById('role-fro-card');
      const driverCard = document.getElementById('role-driver-card');
      const froIcon = document.getElementById('role-fro-icon-box');
      const driverIcon = document.getElementById('role-driver-icon-box');
      const froIndicator = document.getElementById('role-fro-indicator');
      const driverIndicator = document.getElementById('role-driver-indicator');
      const badgeLabel = document.getElementById('badge-label');
      const badgeInput = document.getElementById('badge-id');
      const submitText = document.getElementById('submit-text');

      if (role === 'fro') {
        froCard.className = "relative border-2 border-blue-600 bg-blue-50/60 rounded-2xl p-4 flex items-center justify-between shadow-sm cursor-pointer transition-all duration-200";
        driverCard.className = "relative border border-slate-200 bg-white rounded-2xl p-4 flex items-center justify-between cursor-pointer hover:border-slate-300 transition-all duration-200 shadow-sm";
        
        froIcon.className = "w-11 h-11 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center shrink-0";
        driverIcon.className = "w-11 h-11 rounded-xl bg-slate-100 text-slate-400 flex items-center justify-center shrink-0 transition-colors";

        froIndicator.className = "w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center shrink-0 shadow-sm text-white";
        froIndicator.innerHTML = '<svg class="w-3.5 h-3.5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>';

        driverIndicator.className = "w-6 h-6 rounded-full border-2 border-slate-300 bg-white flex items-center justify-center shrink-0 transition-colors";
        driverIndicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-transparent"></span>';

        badgeLabel.textContent = "Officer Badge ID";
        badgeInput.placeholder = "e.g. FRO-9021";
        submitText.textContent = "Create Officer Account";
      } else {
        driverCard.className = "relative border-2 border-blue-600 bg-blue-50/60 rounded-2xl p-4 flex items-center justify-between shadow-sm cursor-pointer transition-all duration-200";
        froCard.className = "relative border border-slate-200 bg-white rounded-2xl p-4 flex items-center justify-between cursor-pointer hover:border-slate-300 transition-all duration-200 shadow-sm";

        driverIcon.className = "w-11 h-11 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center shrink-0";
        froIcon.className = "w-11 h-11 rounded-xl bg-slate-100 text-slate-400 flex items-center justify-center shrink-0 transition-colors";

        driverIndicator.className = "w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center shrink-0 shadow-sm text-white";
        driverIndicator.innerHTML = '<svg class="w-3.5 h-3.5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>';

        froIndicator.className = "w-6 h-6 rounded-full border-2 border-slate-300 bg-white flex items-center justify-center shrink-0 transition-colors";
        froIndicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-transparent"></span>';

        badgeLabel.textContent = "Commercial Driver License ID";
        badgeInput.placeholder = "e.g. CDL-549102";
        submitText.textContent = "Create Driver Account";
      }
    }

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />';
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
      }
    }
  </script>
</body></html>
